# Site settings
title: "Robert Streetman &vert; ML Engineer, MLOps &vert; Python, Cloud"
description: "Software Engineer Machine Learning Engineer MLOps Engineer AI Engineer Resume Senior Python Cloud"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Robert Streetman"
resume_title:                   "Sr. Software Engineer &vert; Machine Learning Applications & MLOps &vert; Python, Cloud"

# used for the contact button in _layouts/resume.html
